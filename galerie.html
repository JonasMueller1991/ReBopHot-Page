<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie – ReBop Hot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Oswald:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main class="mx-auto max-w-6xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Galerie
      </h1>
      <p class="mt-4 max-w-2xl font-display italic text-cream-dim">
        Eindrücke von unseren Auftritten &ndash; klicken Sie auf ein Bild zum
        Vergrößern.
      </p>

      <!-- Picture grid is generated from src/data.ts by galerie.ts -->
      <section
        id="gallery-grid"
        class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"
      ></section>

      <!-- A simple lightbox, hidden until a picture is clicked.
           Tailwind v4's preflight keeps the `hidden` attribute working
           even though the container is a grid. -->
      <div
        id="lightbox"
        class="fixed inset-0 z-50 grid place-items-center bg-black/90 p-6"
        hidden
      >
        <div class="text-center">
          <div
            class="lightbox-picture mx-auto aspect-[4/3] w-[min(720px,85vw)] rounded-lg border-2 border-gold"
          ></div>
          <p class="lightbox-caption mt-4 uppercase tracking-[0.2em] text-cream-dim"></p>
          <button type="button" class="btn-retro-outline lightbox-close mt-4">
            Schließen
          </button>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/galerie.ts"></script>
  </body>
</html>
