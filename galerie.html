<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie – ReBop Hot</title>
    <meta
      name="description"
      content="Galerie von ReBop Hot: Fotos von Konzerten und Band-Shootings – Swing und Jump-Blues in Bildern."
    />
    <meta property="og:title" content="Galerie – ReBop Hot" />
    <meta
      property="og:description"
      content="Fotos von Konzerten und Band-Shootings – Vintage Dance Music in Bildern."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/band-2022.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main id="main-content" class="mx-auto max-w-6xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Galerie
      </h1>
      <p class="mt-4 max-w-2xl font-display text-cream-dim italic">
        Eindrücke von unseren Auftritten &ndash; klicken Sie auf ein Bild zum
        Vergrößern.
      </p>
      <p class="mt-2 max-w-2xl text-xs text-cream-dim/70">
        Fotos: Band-Shootings von Dominik Frank (2018/2022), Konzertfotos von
        den Veranstaltungsorten.
      </p>

      <!-- Sections (heading + picture grid) are generated from src/data.ts by galerie.ts -->
      <div id="gallery-sections" class="mt-10"></div>

      <!-- A simple lightbox, hidden until a picture is clicked.
           Tailwind v4's preflight keeps the `hidden` attribute working
           even though the container is a grid. -->
      <div
        id="lightbox"
        class="fixed inset-0 z-50 grid place-items-center bg-black/90 p-6"
        hidden
      >
        <div class="text-center">
          <img
            class="lightbox-picture mx-auto aspect-[4/3] w-[min(720px,85vw)] rounded-lg border-2 border-gold bg-black/40 object-contain"
            src=""
            alt=""
          />
          <p
            class="lightbox-caption mt-4 tracking-[0.2em] text-cream-dim uppercase"
          ></p>
          <button type="button" class="btn-retro-outline lightbox-close mt-4">
            Schließen
          </button>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/galerie.ts"></script>
  </body>
</html>
