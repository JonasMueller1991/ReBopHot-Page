<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termine – ReBop Hot</title>
    <meta
      name="description"
      content="Termine und Konzerte von ReBop Hot: kommende Auftritte und Rückblick auf vergangene Konzerte mit Swing und Jump-Blues."
    />
    <meta property="og:title" content="Termine – ReBop Hot" />
    <meta
      property="og:description"
      content="Kommende Auftritte und Rückblicke – Vintage Dance Music live erleben."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved (or system) theme before first paint so the
         page never flashes the wrong mode. Mirrors src/theme.ts. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('rebophot-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          /* storage unavailable: keep the dark default */
        }
      })()
    </script>

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main id="main-content" class="mx-auto max-w-5xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Termine
      </h1>
      <p class="mt-4 max-w-2xl font-display text-cream-dim italic">
        Klicken Sie auf einen Termin, um ein zugehöriges Bild zu &ouml;ffnen.
      </p>

      <!-- Filled by termine.ts: next upcoming events -->
      <section id="upcoming-events" class="mt-10"></section>

      <!-- Filled by termine.ts: the long list of past gigs -->
      <section id="past-events" class="mt-16">
        <h2 class="font-display text-xl text-cream-dim italic">
          ...alter Schnee von gestern: (sch&ouml;n war`s)
        </h2>
      </section>

      <!-- A simple lightbox, hidden until an event card is clicked. -->
      <div
        id="event-lightbox"
        class="keep-dark fixed inset-0 z-50 grid place-items-center bg-black/90 p-6"
        hidden
      >
        <div class="text-center">
          <!-- <picture> so the lightbox can also serve the WebP variants
               (srcset is set by termine.ts when an event is opened). -->
          <picture>
            <source
              class="lightbox-source"
              type="image/webp"
              srcset=""
              sizes="min(720px, 85vw)"
            />
            <img
              class="lightbox-picture mx-auto w-[min(720px,85vw)] rounded-lg border-2 border-gold bg-black/40 object-contain"
              src=""
              alt=""
            />
          </picture>
          <p
            class="lightbox-caption mt-4 tracking-[0.2em] text-cream-dim uppercase"
          ></p>
          <button type="button" class="btn-retro-outline lightbox-close mt-4">
            Schließen
          </button>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/termine.ts"></script>
  </body>
</html>
