<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt – ReBop Hot</title>
    <meta
      name="description"
      content="Kontakt zu ReBop Hot: Buchungsanfrage für Veranstaltungen, E-Mail, Telefon und Facebook."
    />
    <meta property="og:title" content="Kontakt – ReBop Hot" />
    <meta
      property="og:description"
      content="Buchungsanfrage für Veranstaltungen – wir melden uns schnell bei Ihnen."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved (or system) theme before first paint so the
         page never flashes the wrong mode. Mirrors src/theme.ts. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('rebophot-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          /* storage unavailable: keep the dark default */
        }
      })()
    </script>

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main id="main-content" class="mx-auto max-w-2xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Kontakt
      </h1>

      <!-- Contact details are filled in by kontakt.ts -->
      <section id="contact-details" class="mt-10"></section>

      <h2 class="mt-12 font-marquee text-2xl text-gold">Anfrage senden</h2>
      <p class="mt-3 font-display text-cream-dim italic">
        Sie möchten uns für eine Veranstaltung buchen? Schreiben Sie uns &ndash;
        wir melden uns so schnell wie möglich bei Ihnen.
      </p>

      <!-- The form is validated in TypeScript, see src/pages/kontakt.ts -->
      <form id="contact-form" class="mt-8" novalidate>
        <div class="mt-5 flex flex-col gap-1.5">
          <label
            for="name"
            class="text-sm tracking-[0.15em] text-cream-dim uppercase"
          >
            Name *
          </label>
          <input
            type="text"
            id="name"
            name="name"
            class="rounded-md border border-gold/40 bg-stage-soft px-4 py-2.5 text-cream focus:border-gold focus:ring-2 focus:ring-gold/50 focus:outline-none"
          />
          <span class="min-h-5 text-sm text-error" data-error-for="name"></span>
        </div>

        <div class="mt-3 flex flex-col gap-1.5">
          <label
            for="email"
            class="text-sm tracking-[0.15em] text-cream-dim uppercase"
          >
            E-Mail *
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="rounded-md border border-gold/40 bg-stage-soft px-4 py-2.5 text-cream focus:border-gold focus:ring-2 focus:ring-gold/50 focus:outline-none"
          />
          <span
            class="min-h-5 text-sm text-error"
            data-error-for="email"
          ></span>
        </div>

        <div class="mt-3 flex flex-col gap-1.5">
          <label
            for="date"
            class="text-sm tracking-[0.15em] text-cream-dim uppercase"
          >
            Veranstaltungsdatum (optional)
          </label>
          <input
            type="date"
            id="date"
            name="date"
            class="rounded-md border border-gold/40 bg-stage-soft px-4 py-2.5 text-cream focus:border-gold focus:ring-2 focus:ring-gold/50 focus:outline-none"
          />
          <span class="min-h-5 text-sm text-error" data-error-for="date"></span>
        </div>

        <div class="mt-3 flex flex-col gap-1.5">
          <label
            for="message"
            class="text-sm tracking-[0.15em] text-cream-dim uppercase"
          >
            Nachricht *
          </label>
          <textarea
            id="message"
            name="message"
            rows="5"
            class="rounded-md border border-gold/40 bg-stage-soft px-4 py-2.5 text-cream focus:border-gold focus:ring-2 focus:ring-gold/50 focus:outline-none"
          ></textarea>
          <span
            class="min-h-5 text-sm text-error"
            data-error-for="message"
          ></span>
        </div>

        <button type="submit" class="btn-retro mt-6">Absenden</button>
        <p id="form-success" class="mt-4 text-sm text-success" hidden>
          Vielen Dank! Ihre Nachricht wurde (nur im Browser) gespeichert.
        </p>
      </form>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/kontakt.ts"></script>
  </body>
</html>
