<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Band – ReBop Hot</title>
    <meta
      name="description"
      content="Die neunköpfige Band ReBop Hot: Gesang, Bläsersatz und Rhythmusgruppe – Vintage Dance Music aus Karlsruhe/Kraichgau/Pfalz."
    />
    <meta property="og:title" content="Band – ReBop Hot" />
    <meta
      property="og:description"
      content="Die neunköpfige Swing- & Jump-Blues-Combo: Gesang, Bläsersatz und Rhythmusgruppe."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main id="main-content" class="mx-auto max-w-6xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Band
      </h1>

      <section class="mx-auto mt-12 max-w-3xl text-center">
        <p class="font-display text-2xl text-gold italic">
          &ndash; Ready to dance? &ndash;
        </p>
        <!-- Band description is filled in by src/pages/band.ts;
             whitespace-pre-line turns the \n\n in data.ts into paragraphs -->
        <p
          id="band-description"
          class="mt-6 font-display text-lg leading-relaxed whitespace-pre-line text-cream-dim"
        ></p>
      </section>

      <!-- Member cards are generated from src/data.ts by band.ts -->
      <section
        id="member-grid"
        class="mt-12 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      ></section>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/band.ts"></script>
  </body>
</html>
