<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Band – ReBop Hot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Oswald:wght@400;600&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main class="mx-auto max-w-6xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Band
      </h1>

      <section class="mx-auto mt-12 max-w-3xl text-center">
        <p class="font-display text-2xl italic text-gold">
          &ndash; Ready to dance? &ndash;
        </p>
        <!-- Band description is filled in by src/pages/band.ts;
             whitespace-pre-line turns the \n\n in data.ts into paragraphs -->
        <p
          id="band-description"
          class="mt-6 whitespace-pre-line font-display text-lg leading-relaxed text-cream-dim"
        ></p>
      </section>

      <!-- Member cards are generated from src/data.ts by band.ts -->
      <section
        id="member-grid"
        class="mt-12 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      ></section>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/band.ts"></script>
  </body>
</html>
