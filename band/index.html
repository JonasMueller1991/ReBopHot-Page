<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Band – ReBop Hot</title>
    <meta
      name="description"
      content="Die neunköpfige Band ReBop Hot: Gesang, Bläsersatz und Rhythmusgruppe – Vintage Dance Music aus Karlsruhe/Kraichgau/Pfalz."
    />
    <meta property="og:title" content="Band – ReBop Hot" />
    <meta
      property="og:description"
      content="Die neunköpfige Swing- & Jump-Blues-Combo: Gesang, Bläsersatz und Rhythmusgruppe."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved (or system) theme before first paint so the
         page never flashes the wrong mode. Mirrors src/theme.ts. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('rebophot-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          /* storage unavailable: keep the dark default */
        }
      })()
    </script>

    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="min-h-screen font-condensed text-cream antialiased">
    <header id="site-header"></header>

    <main id="main-content" class="mx-auto max-w-6xl px-6 py-14">
      <h1
        class="border-b border-gold/40 pb-3 font-marquee text-3xl text-cream sm:text-4xl"
      >
        Band
      </h1>

      <section class="mx-auto mt-12 max-w-3xl text-center">
        <p class="font-display text-2xl text-gold italic">
          &ndash; Ready to dance? &ndash;
        </p>
        <!-- Band intro + description are filled in by src/pages/band.ts;
             whitespace-pre-line turns the \n\n in data.ts into paragraphs -->
        <p
          id="band-intro"
          class="mt-6 font-display text-lg leading-relaxed text-cream-dim"
        ></p>
        <p
          id="band-description"
          class="mt-6 font-display text-lg leading-relaxed whitespace-pre-line text-cream-dim"
        ></p>
      </section>

      <!-- Member cards are generated from src/data.ts by band.ts.
           Flexbox instead of grid: justify-center also centers the last,
           incomplete row (grid would left-align leftover cards). -->
      <section
        id="member-grid"
        class="mt-12 flex flex-wrap justify-center gap-6"
      ></section>

      <!-- Detail modal for one band member, hidden until a member card
           is clicked. Same overlay pattern as the Termine/Galerie
           lightboxes, but as a card with text instead of a bare picture. -->
      <div
        id="member-modal"
        class="keep-dark fixed inset-0 z-50 grid place-items-center overflow-y-auto bg-black/90 p-6"
        role="dialog"
        aria-modal="true"
        aria-labelledby="member-modal-title"
        hidden
      >
        <div
          class="w-[min(28rem,90vw)] rounded-lg border border-gold/60 bg-stage-soft p-6 text-center"
        >
          <!-- <picture> so the modal can also serve the WebP variants
               (srcset is set by band.ts when a member is opened). The
               portrait keeps its natural aspect ratio here — the full
               photo, not the circular grid crop. -->
          <picture>
            <source
              class="member-modal-source"
              type="image/webp"
              srcset=""
              sizes="min(320px, 80vw)"
            />
            <img
              class="member-modal-picture mx-auto w-[min(320px,80vw)] rounded-lg border-2 border-gold bg-black/40"
              src=""
              alt=""
            />
          </picture>
          <!-- Initials avatar shown instead of the picture for members
               without a portrait — the big sibling of the grid card's
               placeholder circle. -->
          <div
            class="member-modal-initials mx-auto grid h-48 w-48 place-items-center rounded-full bg-gradient-to-br from-gold-pop to-rust font-marquee text-6xl text-ink"
            aria-hidden="true"
            hidden
          ></div>
          <h2
            id="member-modal-title"
            class="mt-4 font-display text-2xl text-cream"
          >
            <span class="member-modal-role text-gold"></span>:
            <span class="member-modal-name"></span>
          </h2>
          <p
            class="member-modal-description mt-4 font-display leading-relaxed text-cream-dim"
          ></p>
          <p class="member-modal-email mt-4 text-sm"></p>
          <button
            type="button"
            class="btn-retro-outline member-modal-close mt-6"
          >
            Schließen
          </button>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/band.ts"></script>
  </body>
</html>
